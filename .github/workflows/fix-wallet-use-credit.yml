name: Apply Use Credit to Existing Wallet Artwork
on:
  push:
    paths:
      - .github/workflows/fix-wallet-use-credit.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  edit-original-wallet-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core
          python -m pip install --quiet pillow opencv-python-headless numpy
      - name: Edit only existing wallet CTA label
        run: python scripts/fix_wallet_use_credit.py
      - name: Commit wallet image change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "public/images/JiTap Wallet Launching Soon.png"
          git diff --cached --quiet && exit 1
          git commit -m "Change Withdraw to Use Credit on original provider wallet poster"
          git push
