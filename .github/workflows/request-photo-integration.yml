name: JiTap production private photo upload E2E
on:
  push:
    branches: [main]
    paths:
      - 'src/app/api/request/photos/**'
      - 'src/app/api/ai/service-photo/**'
      - 'src/app/api/intake/[kind]/route.ts'
      - 'scripts/request-photo-integration.mjs'
      - '.github/workflows/request-photo-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  request-photo:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm production route deployed
        run: |
          for i in {1..45}; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://www.jitap.app/api/request/photos)
            if [ "$code" = "405" ]; then exit 0; fi
            sleep 8
          done
          echo 'Photo endpoint not deployed to production'
          exit 1
      - name: Allow production alias propagation
        run: sleep 45
      - name: Create safe synthetic request and upload 1px PNG
        run: node scripts/request-photo-integration.mjs
        env:
          JITAP_TEST_URL: https://www.jitap.app
