name: Update JiTap Wallet Poster Text
# Final pass: correct Free Credit and Balance values in original image
on:
  push:
    paths:
      - '.github/workflows/update-wallet-poster.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  edit-wallet-poster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image text dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr fonts-dejavu-core
          python -m pip install --quiet pillow pytesseract opencv-python-headless numpy
      - name: Edit original wallet poster labels
        run: python scripts/update_wallet_poster.py
      - name: Commit only the updated wallet image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "public/images/JiTap Wallet Launching Soon.png"
          if git diff --cached --quiet; then echo "No image changes"; exit 1; fi
          git commit -m "Update original wallet poster to KES 1,500 Free Credit and Balance"
          git push
