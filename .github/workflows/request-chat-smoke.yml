name: JiTap request chat mobile smoke
on:
  pull_request:
    paths:
      - 'src/components/GuidedRequest.tsx'
      - 'src/components/ask-entry.css'
      - 'src/components/RequestMatch.tsx'
      - 'src/components/request-match.css'
      - 'src/app/request/match/page.tsx'
      - 'scripts/request-chat-test.mjs'
      - '.github/workflows/request-chat-smoke.yml'
permissions:
  contents: read
jobs:
  chat-smoke:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save playwright@1.56.1
      - run: npm run build
      - name: Start JiTap and test mobile request
        run: |
          (npm run start -- -p 3100 > /tmp/jitap-chat-server.log 2>&1 &)
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:3100/request >/dev/null; then break; fi
            sleep 2
          done
          BASE_URL=http://127.0.0.1:3100 node scripts/request-chat-test.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jitap-request-mobile-smoke
          path: /tmp/jitap-request-mobile-smoke.png
          if-no-files-found: ignore
