name: JiTap provider notifications smoke
on:
  pull_request:
    paths:
      - 'src/lib/provider-alerts.ts'
      - 'src/lib/didit-server.ts'
      - 'src/app/api/provider/identity/**'
      - 'src/components/ProviderIdentityVerification.tsx'
      - 'src/lib/coordinator-session.ts'
      - 'src/lib/coordinator-server.ts'
      - 'src/app/api/coordinator/auth/**'
      - 'src/components/CoordinatorDashboard.tsx'
      - 'src/lib/service-followup-dispatcher.ts'
      - 'src/app/api/coordinator/service-followup/**'
      - 'src/app/api/coordinator/provider-reminder/**'
      - 'src/app/api/provider/calendar/**'
      - 'src/app/api/webhooks/kapso/**'
      - 'supabase/migrations/20261112_*communication*'
      - 'supabase/migrations/20261112_*followup*'
      - 'supabase/migrations/20261112_*provider*eta*'
      - 'src/lib/provider-whatsapp-template.ts'
      - 'src/app/api/coordinator/whatsapp/**'
      - 'src/app/api/coordinator/workflow/**'
      - 'src/app/api/cron/kapso/**'
      - 'src/components/CoordinatorWorkflow.tsx'
      - 'scripts/provider-notifications-smoke.mjs'
      - 'supabase/migrations/20261112_auto_provider_alerts_soc_whatsapp.sql'
      - '.github/workflows/provider-notifications-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/provider-alerts.ts'
      - 'src/lib/didit-server.ts'
      - 'src/app/api/provider/identity/**'
      - 'src/components/ProviderIdentityVerification.tsx'
      - 'src/lib/coordinator-session.ts'
      - 'src/lib/coordinator-server.ts'
      - 'src/app/api/coordinator/auth/**'
      - 'src/components/CoordinatorDashboard.tsx'
      - 'src/lib/service-followup-dispatcher.ts'
      - 'src/app/api/coordinator/service-followup/**'
      - 'src/app/api/coordinator/provider-reminder/**'
      - 'src/app/api/provider/calendar/**'
      - 'src/app/api/webhooks/kapso/**'
      - 'supabase/migrations/20261112_*communication*'
      - 'supabase/migrations/20261112_*followup*'
      - 'supabase/migrations/20261112_*provider*eta*'
      - 'src/lib/provider-whatsapp-template.ts'
      - 'src/app/api/coordinator/whatsapp/**'
      - 'scripts/provider-notifications-smoke.mjs'
      - '.github/workflows/provider-notifications-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notification-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Run JiTap locally
        run: npm run start -- --hostname 127.0.0.1 > /tmp/jitap-notification-server.log 2>&1 &
      - name: Wait for route readiness
        run: |
          for i in {1..30}; do
            if curl --silent --output /dev/null http://127.0.0.1:3000/api/cron/kapso; then exit 0; fi
            sleep 2
          done
          cat /tmp/jitap-notification-server.log
          exit 1
      - name: Verify SOD authorization and notification queue contracts
        run: node scripts/provider-notifications-smoke.mjs
